server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: reference-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/regions/**
            - id: function-catalog-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/functions/**
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/**