server:
  port: 8085

spring:
  application:
    name: function-catalog-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/function_catalog_db
    username: postgres
    password: ${FUNCTION_CATALOG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

jwt:
  public-key: ${JWT_PUBLIC_KEY}

springdoc:
  swagger-ui:
    path: /swagger

azure:
  translator:
    endpoint: ${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}
    key: ${AZURE_TRANSLATOR_KEY:}
    region: ${AZURE_TRANSLATOR_REGION:}
